name: Pantheon Deploy Dev Manually

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: 'Branch to use'
        required: true
        default: 'main'
        type: choice
        options:
          - main

permissions:
  contents: read

env:
  GIT_COMMIT_MESSAGE: 'Github Actions Build'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone the github repo in the Github Action container
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.BRANCH }}

      - name: Set some variables to use in the workflow
        run: |
          echo "NOW=$(date +'%Y-%m-%dT%H:%M:%S')" >> $GITHUB_ENV
          echo "NOW_GIT_SAFE=$(date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_ENV
          echo "GRUMPHP_GIT_WORKING_DIR=$(git rev-parse --show-toplevel)" >> $GITHUB_ENV

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION }}
          extensions: gd, sodium, zip, gmp

      - name: Make composer available and do a composer install to build Drupal
        run: composer install --no-dev --no-scripts --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Setup Node with the version set in .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '${{ vars.THEME_PATH }}/.nvmrc'
          cache: 'npm'
          cache-dependency-path: '${{ vars.THEME_PATH }}/package-lock.json'

      - name: Build nysenate_theme Theme Assets
        env:
          THEME_PATH: ${{ vars.THEME_PATH }}
        run: |
          cd "$THEME_PATH"
          npm ci --ignore-scripts
          npm run build

      - name: Update NodeJS to version in nys theme via .nvmrc.
        uses: actions/setup-node@v4
        with:
          node-version-file: 'web/themes/custom/nys/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'web/themes/custom/nys/package-lock.json'

      - name: Build nys Theme Assets
        run: |
          cd web/themes/custom/nys
          npm ci --ignore-scripts
          npm run build

      - name: Prepare release artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pantheon-artifact"
          bash scripts/build-pantheon-artifact.sh "$RUNNER_TEMP/pantheon-artifact"

      - name: Add the Pantheon SSH Key for the CI user
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}

      - name: Retain existing Pantheon SSH connection policy
        run: 'printf "\nHost *.drush.in\n  StrictHostKeyChecking no\n" >> "$HOME/.ssh/config"'

      - name: Configure Git for the deployment commit
        run: |
          git config --global user.name "NY Senate CI Bot"
          git config --global user.email "zalewski.senate+github@gmail.com"

      - name: Install verified Terminus
        run: |
          bash scripts/install-terminus.sh "$RUNNER_TEMP/terminus"
          echo "$RUNNER_TEMP/terminus" >> "$GITHUB_PATH"

      - name: Authenticate Terminus
        env:
          PANTHEON_MACHINE_TOKEN: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
        run: "$RUNNER_TEMP/terminus/terminus auth:login --machine-token=\"$PANTHEON_MACHINE_TOKEN\""

      - name: Deploy prepared artifact to Pantheon
        env:
          PANTHEON_GIT_REMOTE: ${{ vars.PANTHEON_GIT_REMOTE }}
        run: |
          cd "$RUNNER_TEMP/pantheon-artifact"
          git init
          git remote add pantheon "$PANTHEON_GIT_REMOTE"
          git checkout -b "nys-build-artifact-${{ env.NOW_GIT_SAFE }}"
          git add -Af .
          git commit -q -m "${{ env.GIT_COMMIT_MESSAGE }} - ${{ env.NOW }}"
          git push --force pantheon HEAD:refs/heads/master

      - name: Post to a Slack channel
        if: always()
        id: slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: '${{ vars.SLACK_CHANNEL }}'
          slack-message: "@${{ github.actor }} deployed a new release and it was a ${{ job.status }}!\nUsing Workflow: ${{ github.workflow }}\nPantheon: https://dev-${{ vars.PANTHEON_SITE }}.pantheonsite.io"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
