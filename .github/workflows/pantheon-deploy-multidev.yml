name: Pantheon Deploy Multi-Dev
# Github Action triggers when a branch is created off of main named
# feature/this-is-a-great-branch and a pull request is opened.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pantheon-multidev-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy_multidev:
    if: startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    env:
      PANTHEON_SITE: ${{ vars.PANTHEON_SITE }}
      SOURCE_ENV: ${{ vars.PANTHEON_MULTIDEV_CLONE_ENV }}
      PANTHEON_MULTIDEV: pr-${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@v4

      - name: Push to Pantheon
        uses: pantheon-systems/push-to-pantheon@0.9.7
        with:
          ssh_key: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}
          machine_token: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
          site: ${{ vars.PANTHEON_SITE }}
          source_env: ${{ vars.PANTHEON_MULTIDEV_CLONE_ENV }}
          skip_build_tools: true
          clone_files: false

      - name: Verify the pushed revision
        shell: bash
        run: |
          expected=$(git rev-parse HEAD)
          remote=$(git ls-remote --exit-code pantheon "refs/heads/$PANTHEON_MULTIDEV" | cut -f1)
          if [[ "$remote" != "$expected" ]]; then
            echo "::error::Pantheon's PR branch does not match the checked-out revision. Check the push log and the Multidev's Git connection mode."
            exit 1
          fi

      - name: Copy the private settings file over SFTP
        run: |
          umask 077
          LOCAL_FILE=$(mktemp "$RUNNER_TEMP/private-settings.XXXXXX")
          trap 'rm -f -- "$LOCAL_FILE"' EXIT
          SETTINGS_FILE=files/private/private_settings.php
          SOURCE_SFTP_COMMAND=$(terminus connection:info --field=sftp_command -- "$PANTHEON_SITE.$SOURCE_ENV")
          DEST_SFTP_COMMAND=$(terminus connection:info --field=sftp_command -- "$PANTHEON_SITE.$PANTHEON_MULTIDEV")
          read -r -a SOURCE_SFTP_ARGS <<< "$SOURCE_SFTP_COMMAND"
          read -r -a DEST_SFTP_ARGS <<< "$DEST_SFTP_COMMAND"
          printf 'get "%s" "%s"\n' "$SETTINGS_FILE" "$LOCAL_FILE" |
            "${SOURCE_SFTP_ARGS[0]}" -b - "${SOURCE_SFTP_ARGS[@]:1}"
          if [[ ! -s "$LOCAL_FILE" ]]; then
            echo "::error::The source private settings file is empty."
            exit 1
          fi
          printf '%s\n' '-mkdir files/private' "put \"$LOCAL_FILE\" \"$SETTINGS_FILE\"" |
            "${DEST_SFTP_ARGS[0]}" -b - "${DEST_SFTP_ARGS[@]:1}"

      - name: Wait for Pantheon's build
        shell: bash
        timeout-minutes: 25
        run: |
          expected=$(git rev-parse HEAD)
          WAIT_LOG=$(mktemp "$RUNNER_TEMP/pantheon-workflow.XXXXXX")
          trap 'rm -f -- "$WAIT_LOG"' EXIT
          # Include earlier workflows so rerunning an unchanged commit can reuse its successful build.
          terminus workflow:wait "$PANTHEON_SITE.$PANTHEON_MULTIDEV" \
            --commit="$expected" --start=1 --max=1200 2>&1 | tee "$WAIT_LOG"
          # Terminus can exit zero on timeout or when it cannot find the workflow.
          if ! grep -Fq "completed successfully for commit $expected" "$WAIT_LOG"; then
            echo "::error::Pantheon did not confirm a successful workflow for the pushed revision. Inspect its build logs."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Cache regression tests
  #
  # Runs DTT ExistingSite tests ON the Pantheon multidev container itself via
  # `terminus remote:drush -- ev`. The test process must run inside the
  # container because Pantheon's Redis (used for page cache tag checksums) is
  # not reachable from outside the container network. Running inside ensures
  # the test process and the web server share the same DB and Redis instance,
  # so entity saves correctly invalidate cache entries via Redis.
  #
  # PHPUnit must be installed by Integrated Composer on the multidev.
  #
  # Runs most, but not all, chunks from tests/dtt/test-chunks.yml — chunks
  # marked `ci: false` (AnonymousCacheNonInvalidationTest) are skipped here due
  # to an unresolved CDN BAN propagation race; see tests/dtt/README.md.
  #
  # To run the full local suite (including the chunks skipped here):
  #   ddev run-cache-tests
  # ---------------------------------------------------------------------------
  run_cache_tests:
    needs: deploy_multidev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup PHP (required to run Terminus)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION }}

      - name: Add the Pantheon SSH Key for the CI user
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}

      - name: Install and authenticate Terminus
        uses: pantheon-systems/terminus-github-actions@v1
        with:
          pantheon-machine-token: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
          disable-cache: true

      - name: Set multidev environment name
        run: echo "PANTHEON_MULTIDEV=pr-${{ github.event.pull_request.number }}" >> $GITHUB_ENV

      - name: Remove 'cache-tests-passed' label if present (will be re-added on success)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'cache-tests-passed'
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              // 404 means the label wasn't present — that's fine
            }

      - name: Wake up the multidev (Pantheon envs sleep when idle)
        run: terminus env:wake ${{ vars.PANTHEON_SITE }}.${{ env.PANTHEON_MULTIDEV }}

      - name: Clear Cloudflare and Drupal caches before test run
        # Ensures every cache test starts from a cold Cloudflare cache whose
        # surrogate-key index was built by the current deployment. Without this,
        # warmCache() may poll a stale CF HIT that was stored by a previous
        # deployment with different cache tags, causing BAN-based invalidations
        # to miss and assertAnonymousCacheMiss() to see a spurious HIT.
        run: terminus env:clear-cache ${{ vars.PANTHEON_SITE }}.${{ env.PANTHEON_MULTIDEV }}

      - name: Wait for multidev HTTP endpoint to be ready
        # Polls the homepage until it returns a non-5xx status. Handles the
        # gap between workflow completion and the appserver accepting requests.
        # 40 attempts × 30 s = up to 20 minutes total.
        run: |
          SITE_URL="https://${{ env.PANTHEON_MULTIDEV }}-${{ vars.PANTHEON_SITE }}.pantheonsite.io"
          echo "Polling $SITE_URL..."
          for i in $(seq 1 40); do
            STATUS=$(curl -sSo /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$SITE_URL/" 2>/dev/null || echo "000")
            if [[ "$STATUS" =~ ^[23] ]]; then
              echo "Site ready (HTTP $STATUS, attempt $i/40)"
              break
            fi
            if [[ $i -eq 40 ]]; then
              echo "Timed out waiting for site to be ready (last HTTP $STATUS)" >&2
              exit 1
            fi
            echo "Attempt $i/40: HTTP $STATUS — sleeping 30s"
            sleep 30
          done

      - name: Run cache regression tests on Pantheon container
        # Delegates to tests/dtt/run-all-chunks.sh, which reads test-chunks.yml
        # and calls run-on-container.sh once per chunk via terminus. See the
        # script for details on SSH-session-per-chunk and exit code semantics.
        #
        # Wrapped in a retry: Cloudflare's Pantheon-multidev BAN dispatch is
        # asynchronous with no observable "propagation complete" signal (see
        # tests/dtt/README.md), so an occasional cache assertion can fail on a
        # timing race rather than a real regression. All entity saves in this
        # suite are non-destructive re-saves, so a full rerun re-exercises real
        # cache invalidation behavior from scratch and is safe to repeat — a
        # genuine regression will fail again on the retry too.
        uses: nick-fields/retry@v3
        env:
          PANTHEON_TEST_UA: ${{ secrets.PANTHEON_TEST_UA }}
        with:
          timeout_minutes: 45
          max_attempts: 2
          command: |
            bash tests/dtt/run-all-chunks.sh \
              "${{ vars.PANTHEON_SITE }}.${{ env.PANTHEON_MULTIDEV }}" \
              "https://${{ env.PANTHEON_MULTIDEV }}-${{ vars.PANTHEON_SITE }}.pantheonsite.io"

      - name: Add 'cache-tests-passed' label to PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['cache-tests-passed']
            });

  # ---------------------------------------------------------------------------
  # Accessibility regression tests
  #
  # Runs Playwright and Axe on the GitHub runner against the public Pantheon
  # multidev deployed for this pull request. These are black-box browser tests
  # and do not need access to Pantheon's internal Redis or Drupal runtime. Run
  # them after cache tests because their GET requests can warm page/CDN caches.
  # ---------------------------------------------------------------------------
  run_accessibility_tests:
    needs: [deploy_multidev, run_cache_tests]
    if: always() && needs.deploy_multidev.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      BASE_URL: https://pr-${{ github.event.pull_request.number }}-${{ vars.PANTHEON_SITE }}.pantheonsite.io
      TEST_PATH: tests/accessibility

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Remove 'accessibility-tests-passed' label if present (will be re-added on success)
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'accessibility-tests-passed'
              });
            } catch (e) {
              if (e.status !== 404) throw e;
              // 404 means the label wasn't present — that's fine
            }

      - name: Wait for multidev HTTP endpoint to be ready
        env:
          PANTHEON_TEST_UA: ${{ secrets.PANTHEON_TEST_UA }}
        run: |
          echo "Polling $BASE_URL..."
          curl --fail --silent --show-error \
            --retry 40 \
            --retry-all-errors \
            --retry-delay 30 \
            --retry-max-time 1200 \
            --connect-timeout 10 \
            --max-time 30 \
            --user-agent "$PANTHEON_TEST_UA" \
            "$BASE_URL/" \
            --output /dev/null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '${{ env.TEST_PATH }}/.nvmrc'
          cache: npm
          cache-dependency-path: '${{ env.TEST_PATH }}/package-lock.json'

      - name: Install accessibility test dependencies
        working-directory: ${{ env.TEST_PATH }}
        run: npm ci --ignore-scripts

      - name: Install Chromium and system dependencies
        working-directory: ${{ env.TEST_PATH }}
        run: npx playwright install --with-deps chromium

      - name: Run accessibility regression tests
        env:
          PANTHEON_TEST_UA: ${{ secrets.PANTHEON_TEST_UA }}
        working-directory: ${{ env.TEST_PATH }}
        run: npm test

      - name: Upload accessibility test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: |
            ${{ env.TEST_PATH }}/playwright-report/
            ${{ env.TEST_PATH }}/test-results/
          retention-days: 30

      - name: Add 'accessibility-tests-passed' label to PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['accessibility-tests-passed']
            });

  # ---------------------------------------------------------------------------
  # Slack notification — always runs after deploy and tests so a single
  # post per PR reports the outcome of both.
  # ---------------------------------------------------------------------------
  notify:
    needs: [deploy_multidev, run_cache_tests, run_accessibility_tests]
    runs-on: ubuntu-latest
    if: always() && needs.deploy_multidev.result != 'skipped'
    steps:
      - name: Post to a Slack channel
        uses: slackapi/slack-github-action@v1.24.0
        with:
          channel-id: '${{ vars.SLACK_CHANNEL }}'
          slack-message: "@${{ github.actor }} PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.html_url }}\nDeploy: ${{ needs.deploy_multidev.result }}\nCache tests: ${{ needs.run_cache_tests.result }}\nAccessibility tests: ${{ needs.run_accessibility_tests.result }}\nPantheon: https://pr-${{ github.event.pull_request.number }}-${{ vars.PANTHEON_SITE }}.pantheonsite.io"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
