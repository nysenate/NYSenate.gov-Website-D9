name: Pantheon PR Merge Cleanup

on:
  pull_request:
    branches:
      - main
    types: [ closed ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the trusted installation script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION }}
          extensions: gmp

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}

      - name: Get the Pantheon Multidev Name
        run: echo PANTHEON_MULTIDEV=$(echo "pr-${{ github.event.pull_request.number }}") >> $GITHUB_ENV

      - name: Install and authenticate Terminus
        run: |
          bash scripts/install-terminus.sh "$RUNNER_TEMP/terminus"
          echo "$RUNNER_TEMP/terminus" >> "$GITHUB_PATH"

      - name: Authenticate Terminus
        env:
          PANTHEON_MACHINE_TOKEN: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
        run: terminus auth:login --machine-token="$PANTHEON_MACHINE_TOKEN"

      - name: Delete Pantheon Multidev
        run: terminus multidev:delete ${{ vars.PANTHEON_SITE }}.${{ env.PANTHEON_MULTIDEV }} --yes
        continue-on-error: true
