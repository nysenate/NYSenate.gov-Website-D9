name: Pantheon Refresh Training Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the trusted installation script
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION }}
          extensions: gmp

      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PANTHEON_SSH_PRIVATE_KEY }}

      - name: Retain existing Pantheon SSH connection policy
        run: 'printf "\nHost *.drush.in\n  StrictHostKeyChecking no\n" >> "$HOME/.ssh/config"'

      - name: Install and authenticate Terminus
        run: |
          bash scripts/install-terminus.sh "$RUNNER_TEMP/terminus"
          echo "$RUNNER_TEMP/terminus" >> "$GITHUB_PATH"

      - name: Authenticate Terminus
        env:
          PANTHEON_MACHINE_TOKEN: ${{ secrets.PANTHEON_MACHINE_TOKEN }}
        run: terminus auth:login --machine-token="$PANTHEON_MACHINE_TOKEN"

      - name: Mirror the latest code from master into the training environment
        run: |
          git clone -o pantheon -b master ${{ vars.PANTHEON_GIT_REMOTE }} ./
          git push -f pantheon master:training

      - name: Refresh the training environment from live without files
        run: terminus env:clone-content ${{ vars.PANTHEON_SITE }}.live training --yes --db-only
