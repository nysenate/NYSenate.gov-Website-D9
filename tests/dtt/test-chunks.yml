# Test chunk definitions for the DTT cache regression suite.
#
# This is the single source of truth for how the suite is split into separate
# PHP processes at runtime. The CI workflow (pantheon-deploy-multidev.yml, via
# python3) and .ddev/commands/web/run-cache-tests (local, via PHP/symfony/yaml)
# both read this file. run-on-container.sh does not — chunking is the caller's
# responsibility; this script just runs PHPUnit with whatever args it receives.
#
# WHY CHUNKS EXIST
# Each chunk runs as a separate terminus SSH session. This serves two purposes:
#   1. SSH timeout safety: a single long-running session risks being cut off by
#      Pantheon mid-suite; capping each session to one chunk bounds the risk.
#   2. CI visibility: each chunk produces independent pass/fail output, making
#      it easy to identify failing test classes without a monolithic log.
# Memory is not a constraint: with New Relic disabled (-d newrelic.enabled=0 in
# run-on-container.sh) the entire suite uses ~40 MB. The prior SIGKILL (exit 137)
# was caused by New Relic's PHP instrumentation filling the 9 GB container cgroup,
# not by Drupal or test heap size.
#
# CHUNK SIZING (current suite)
# The suite runs ~51 test cases across 9 chunks.
# AnonymousCacheHitTest is split into two chunks for historical reasons (the split
# predates the New Relic diagnosis). It can be recombined without issue.
#   Chunk 1: testAnonymousCacheHit — 6 cases (top-level pages only).
#   Chunk 2: testContentTypeDisplayPageCacheHit|testOpenLegBrowsePageCacheHit
#            — 7 + 3 = 10 cases.
# AnonymousCacheNonInvalidationTest is split into two chunks to keep each SSH
# session under Pantheon's 10-minute idle timeout on slower environments (dev).
#   Chunk 1: article + bill non-invalidation (2 cases).
#   Chunk 2: event + petition non-invalidation (2 cases).
# AuthenticatedDynamicCacheTest: 6 cases (2 top-level + 2 content types + 1 senator
# microsite, all cross-user; plus 1 account-change invalidation).
# CacheMissInvalidationTest: split across 3 chunks to bound per-process memory;
# the content type chunk merges node-edit (2 cases) with related-entity-edit
# (6 cases) and the OpenLeg flush test (1 case) to avoid an under-sized chunk.
# NoCachePoisoningTest: 6 cases (2 flag, 1 user menu, 1 senator section, 1 bill
# vote widget, 1 anonymous leak).
#
# ADDING A TEST
# - If the new test belongs to a class that runs as a single chunk
#   (AuthenticatedDynamicCacheTest or NoCachePoisoningTest), no change is needed.
# - If the new test is in a split class (AnonymousCacheHitTest,
#   AnonymousCacheNonInvalidationTest, or CacheMissInvalidationTest), add the
#   method name to the relevant filter below.
# - If you add a new test class, add a new chunk entry at the end.
#
# FILTER SYNTAX
# Each 'filter' value is passed directly to PHPUnit's --filter option.
# Use the ClassName::(method1|method2) regex format to select specific methods.
# A bare class name selects all methods in that class.

chunks:

  - label: "AnonymousCacheHitTest (top-level pages)"
    filter: "AnonymousCacheHitTest::testAnonymousCacheHit"

  - label: "AnonymousCacheHitTest (content type display pages + OpenLeg browse)"
    filter: "AnonymousCacheHitTest::(testContentTypeDisplayPageCacheHit|testOpenLegBrowsePageCacheHit)"

  - label: "AnonymousCacheNonInvalidationTest (article + bill)"
    filter: "AnonymousCacheNonInvalidationTest::(testArticleEditDoesNotInvalidateUnrelatedPages|testBillEditDoesNotInvalidateUnrelatedPages)"

  - label: "AnonymousCacheNonInvalidationTest (event + petition)"
    filter: "AnonymousCacheNonInvalidationTest::(testEventEditDoesNotInvalidateUnrelatedPages|testPetitionEditDoesNotInvalidateAnyTopLevelPage)"

  - label: "AuthenticatedDynamicCacheTest"
    filter: "AuthenticatedDynamicCacheTest"

  - label: "CacheMissInvalidationTest (top-level pages — homepage and news)"
    filter: "CacheMissInvalidationTest::(testHomepage|testNewsAndIssues)"

  - label: "CacheMissInvalidationTest (top-level pages — senators, legislation, events, about)"
    filter: "CacheMissInvalidationTest::(testSenatorsCommittees|testLegislation|testEvents|testAbout)"

  - label: "CacheMissInvalidationTest (content type display pages + OpenLeg flush)"
    filter: "CacheMissInvalidationTest::(testContentTypeDisplayPage|testArticlePage|testEventPage|testInTheNews|testMeeting|testPublicHearing|testResolution|testOpenLegBrowsePage)"

  - label: "NoCachePoisoningTest"
    filter: "NoCachePoisoningTest"

