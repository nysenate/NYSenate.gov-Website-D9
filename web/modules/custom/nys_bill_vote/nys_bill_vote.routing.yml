bill_vote.widget:
  path: '/bill-vote/{bill_node}'
  defaults:
    _form: '\Drupal\nys_bill_vote\Form\BillVoteWidgetForm'
  methods: [POST]
  requirements:
    _permission: 'access content'
    _entity_access: 'bill_node.view'
  options:
    parameters:
      bill_node:
        type: entity:node
        bundle: ['bill']
