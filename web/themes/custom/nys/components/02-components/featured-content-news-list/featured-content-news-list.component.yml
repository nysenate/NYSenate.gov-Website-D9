$schema: https://git.drupalcode.org/project/sdc/-/raw/1.x/src/metadata.schema.json
name: Featured Content News List
description: Featured story card for the top of a news listing view (Articles, Press Releases, In the News).
props:
  type: object
  required: [title, url]
  properties:
    title:
      type: string
      description: The title of the content.
    url:
      type: string
      description: The URL of the content.
    image:
      type: string
      description: Rendered image field markup, if any.
    issues:
      type: string
      description: Rendered issue tags field markup, if any.
    date:
      type: string
      description: Formatted date string.
    microsite:
      type: string
      description: Senator page context, if the content is associated with a senator microsite.
    content_type:
      type: string
      description: Human-readable content type label (from nys_content_type).
